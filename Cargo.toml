[package]
name = "remvibe_archive"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
remvibe_filesystem_core = { git = "https://github.com/nusretm/remvibe_filesystem.git", rev = "3942a39bbdecf84144709e899b986fe19c6b8c06" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zstd = { version = "0.13", default-features = false }
